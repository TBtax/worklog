<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyTrackบันทึกการปฏิบัติงานประจำวัน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'Inter', 'sans-serif'], 
                    },
                    colors: {
                        'primary-accent': '#3a0172',
                        'primary-hover': '#290150',
                        'soft-focus': '#5e179d',
                        'page-bg': '#f4f0fa',
                        'soft-divider': '#eae4f3',
                        'accent-sunset': '#f72585',
                        'active-text-main': '#1f2937',
                        'active-text-table': '#000000',
                        'placeholder-text': '#9ca3af',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-image: linear-gradient(to top, #a18cd1 0%, #fbc2eb 100%);
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-position: center center;
            background-color: #f4f0fa;
        }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: #3a0172;
            box-shadow: 0 0 0 2px rgba(58, 1, 114, 0.3);
            outline: none;
        }
        .input-group input, .input-group select {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); 
            transition: all 0.2s;
        }
        .input-group input[type="date"], .input-group input[type="text"] { color: #1f2937; }
        .input-group input[type="text"]::placeholder { color: #9ca3af; }
        .input-group select:valid { color: #1f2937; }
        .input-group textarea::placeholder { color: #9ca3af; }

        .log-table {
            border-collapse: separate;
            border-spacing: 0 0; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            border-radius: 12px; 
            overflow: hidden; 
            width: 100%; 
            table-layout: fixed; 
        }
        .log-table th {
            background-color: #e9e5f1;
            color: #3a0172;
            font-weight: 550;
            text-transform: uppercase;
            font-size: 0.75rem;
            border: none;
            border-right: 1px solid #eae4f3;
            padding: 10px 6px;
        }
        .log-table td {
             background-color: #ffffff;
             border: none; 
             border-bottom: 1px solid #eae4f3;
             padding: 8px 6px;
             vertical-align: middle;
             font-size: 11px;
             color: #000000;
        }
        .log-table input[type="text"], .log-table input[type="number"], .log-table select { 
            border: 1px solid #e5e7eb;
            height: 30px; 
            border-radius: 4px;
            font-size: 11px; 
            transition: border-color 0.2s;
            padding: 4px 6px; 
            width: 100%;
            color: #000000;
        }
        .log-table input[type="text"]::placeholder, .log-table input[type="number"]::placeholder { color: #9ca3af; }
        .log-table input[type="text"]:focus, .log-table input[type="number"]:focus, .log-table select:focus {
            border-color: #3a0172;
            box-shadow: none;
        }
        .log-table tbody tr:hover td { background-color: #f6f4fa; } 
        
        .modal-backdrop {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        #export-data-container { position: absolute; left: -9999px; top: -9999px; }
        .group-header-option { background-color: #e9e5f1 !important; color: #3a0172 !important; font-weight: 700 !important; padding: 6px 4px !important; }
        .placeholder-background { background-color: #f8f4ff !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/table2excel@1.0.4/dist/table2excel.min.js"></script>
</head>

<body class="font-sans min-h-screen px-4 pb-4 pt-2 sm:px-8 sm:pb-8 sm:pt-4">

    <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-2xl p-6 md:p-12 border border-gray-100 transition-all duration-300">

        <header class="mb-6 border-b-4 border-primary-accent/50 pb-3">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                <h1 class="text-2xl font-extrabold text-gray-800 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="inline-block w-6 h-6 mr-1" viewBox="0 0 24 24">
                        <path fill="#e9e5f1" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" />
                        <path fill="#3a0172" d="M14 2v6h6" />
                        <path fill="#f72585" d="M16 13H8v-2h8v2zm-8 4h8v-2H8v2z" />
                    </svg>
                    DailyTrack บันทึกการปฏิบัติงานประจำวัน
                </h1>

                <div class="flex space-x-6 items-center">
                    <div class="input-group flex items-center space-x-2">
                        <label for="date" class="text-sm font-semibold text-gray-700 whitespace-nowrap">
                            📅 วันที่บันทึก <span class="text-accent-sunset">*</span>
                        </label>
                        <input type="text" id="date" required class="p-2 text-sm w-36" placeholder="วว/ดด/ปปปป"> 
                    </div>

                    <div class="input-group flex items-center space-x-2">
                        <label for="requester" class="text-sm font-semibold text-gray-700 whitespace-nowrap">
                            👤 ชื่อพนักงาน <span class="text-accent-sunset">*</span>
                        </label>
                        <select id="requester" required class="p-2 text-sm bg-white w-52">
                            <option value="" disabled selected>-- กำลังโหลดพนักงาน --</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <form id="logForm">
            <div class="space-y-8">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-800">รายละเอียดงาน <span class="text-accent-sunset">*</span></h3>
                    </div>
                    <table class="w-full log-table">
                        <colgroup>
                            <col style="width: 2%;"> <col style="width: 15%;"> <col style="width: 15%;"> <col style="width: 14%;"> <col style="width: 19%;"> <col style="width: 13%;"> <col style="width: 9%;"> <col style="width: 9%;"> <col style="width: 10%;"> <col style="width: 13%;"> <col style="width: 7%;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>#</th> <th>ผู้แจ้งงาน</th> <th>Agent</th> <th>หัวข้องาน</th> <th>รายละเอียดงาน</th> <th>ปัญหาที่พบ (ถ้ามี)</th> <th>ชม.</th> <th>นาที</th> <th>สถานะ</th> <th>ที่ปรึกษา</th> <th> </th>
                            </tr>
                        </thead>
                        <tbody id="log-table-body"></tbody>
                    </table>
                </div>
                
                <div class="mt-4 flex justify-center">
                    <button type="button" id="addRowBtn" class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-full text-primary-accent bg-white hover:bg-page-bg">
                        เพิ่มบรรทัด
                    </button>
                </div>

                <div class="pt-8 border-t border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">รายละเอียดการลาหยุด / อบรม / ลงพื้นที่</h3>
                    <div class="space-y-4">
                        <div class="flex items-center space-x-4 input-group">
                            <input type="checkbox" id="leave_checkbox" class="h-4 w-4 text-primary-accent border-gray-300 rounded">
                            <label for="leave_checkbox" class="text-sm font-medium text-gray-700 w-24">ลา</label>
                            <input type="text" id="leave_details" placeholder="ลาxxx ระบุ ว/ด/ป" class="p-2 text-sm flex-grow">
                        </div>
                        <div class="flex items-center space-x-4 input-group">
                            <input type="checkbox" id="training_checkbox" class="h-4 w-4 text-primary-accent border-gray-300 rounded">
                            <label for="training_checkbox" class="text-sm font-medium text-gray-700 w-24">อบรมประจำปี</label>
                            <input type="text" id="training_details" placeholder="อบรมหลักสูตรxxx" class="p-2 text-sm flex-grow">
                        </div>
                        <div class="flex items-center space-x-4 input-group">
                            <input type="checkbox" id="fieldwork_checkbox" class="h-4 w-4 text-primary-accent border-gray-300 rounded">
                            <label for="fieldwork_checkbox" class="text-sm font-medium text-gray-700 w-24">ลงพื้นที่</label>
                            <input type="text" id="fieldwork_details" placeholder="ระบุสถานที่" class="p-2 text-sm flex-grow">
                        </div>
                        <div class="flex items-center space-x-4 input-group">
                            <label for="substitute_worker" class="text-xs font-medium text-gray-700 w-32">ผู้ปฏิบัติงานแทน</label>
                            <select id="substitute_worker" class="p-2 text-sm bg-white flex-grow">
                                <option value="" selected>-- กำลังโหลดพนักงาน --</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="pt-8 border-t border-gray-200">
                    <div class="input-group">
                        <label for="notes" class="block text-lg font-bold text-gray-800 mb-2">📝 หมายเหตุ (ถ้ามี)</label>
                        <textarea id="notes" rows="3" placeholder="รายละเอียดเพิ่มเติม" class="w-full p-3 border border-gray-300 rounded-lg"></textarea>
                    </div>
                </div>

                <div class="pt-6 text-right">
                    <div id="totalDurationDisplay" class="text-xl font-bold text-gray-800 mb-4"></div>
                    <button type="submit" id="submitBtn" class="inline-flex items-center px-8 py-3 text-base font-bold rounded-full shadow-lg text-white bg-primary-accent hover:bg-primary-hover transition duration-150">
                        บันทึกการปฏิบัติงาน
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div id="exportModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-backdrop opacity-0" id="exportModalBackdrop"></div>
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full transform scale-90 opacity-0 relative z-10" id="exportModalContent">
            <div class="p-6 text-center">
                <h4 class="text-lg font-bold text-gray-800 mb-4">บันทึกสำเร็จ! ต้องการ Export Excel ไหม?</h4>
                <div class="flex justify-center space-x-6">
                    <button id="exportExcelBtn" class="px-6 py-3 bg-green-600 text-white font-bold rounded-full">Export</button>
                    <button id="closeModalBtn" class="px-6 py-3 bg-red-600 text-white font-bold rounded-full">ไม่ต้องการ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="finalStatusModal" class="fixed inset-0 z-[101] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-backdrop opacity-0" id="finalStatusModalBackdrop"></div>
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full transform scale-90 opacity-0 relative z-10" id="finalStatusModalContent">
            <div class="p-6 text-center">
                <p id="finalMessageText" class="text-gray-700 text-xl font-medium mb-6"></p>
                <button id="closeFinalModalBtn" class="px-6 py-3 bg-primary-accent text-white font-bold rounded-full">ตกลง</button>
            </div>
        </div>
    </div>

    <div id="messageBox" class="fixed bottom-4 right-4 p-4 rounded-xl shadow-2xl text-white hidden z-50">
        <p id="messageText"></p>
    </div>

    <div id="export-data-container"><table id="combined-export-table"><tbody></tbody></table></div>

   <script>
    // --- 1. Webhook URL (ลิงก์เดิมของคุณ) ---
    const GAS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbw-tTXXzT13JCW_kgXS63fMF9m8KayQ-fR2w3V_ZWkpOE0QGyQA1EbbAnufFdzWLPvq/exec';

    // --- CONFIGURATION ---
    const EMPLOYEE_LIST_JSON_URL = './employees.json';
    const AGENT_LIST_JSON_URL = './agents.json';
    const CUSTOMER_LIST_JSON_URL = './requesters.json';
    const TOPIC_LIST_JSON_URL = './topics.json';
    const TIME_OPTIONS_JSON_URL = './time_options.json';
    const STATUS_OPTIONS_JSON_URL = './status.json';

    let finalExportData = null; 

    let EMPLOYEE_OPTIONS = [], AGENT_OPTIONS = [], CUSTOMER_OPTIONS = [], TOPIC_OPTIONS = [];
    let TIME_OPTIONS = { hours: [], minutes: [] }, STATUS_OPTIONS_LOADED = [];
    let totalRows = 0;
    const ROWS_TO_ADD_BATCH = 10;
    const PLACEHOLDER_TEXT_COLOR = '#9ca3af', ACTIVE_TEXT_COLOR = '#000000';

    function showMessage(text, type = 'error') {
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        messageText.textContent = text;
        messageBox.className = `fixed bottom-4 right-4 p-4 rounded-xl shadow-2xl z-50 ${type === 'error' ? 'bg-red-600' : 'bg-green-600'} text-white`;
        messageBox.classList.remove('hidden');
        setTimeout(() => messageBox.classList.add('hidden'), 5000);
    }

    async function loadConfigurationData() {
        try {
            const [emp, ag, cust, top, time, stat] = await Promise.all([
                fetch(EMPLOYEE_LIST_JSON_URL).then(r => r.json()),
                fetch(AGENT_LIST_JSON_URL).then(r => r.json()),
                fetch(CUSTOMER_LIST_JSON_URL).then(r => r.json()),
                fetch(TOPIC_LIST_JSON_URL).then(r => r.json()),
                fetch(TIME_OPTIONS_JSON_URL).then(r => r.json()),
                fetch(STATUS_OPTIONS_JSON_URL).then(r => r.json())
            ]);
            EMPLOYEE_OPTIONS = emp; AGENT_OPTIONS = ag; TOPIC_OPTIONS = top; 
            TIME_OPTIONS = time; STATUS_OPTIONS_LOADED = stat;
            CUSTOMER_OPTIONS = Array.isArray(cust) ? cust.map(n => ({ isHeader: false, text: n, value: n })) : [];

            const empSelect = document.getElementById('requester');
            const subSelect = document.getElementById('substitute_worker');
            empSelect.innerHTML = '<option value="" disabled selected>-- เลือกชื่อพนักงาน --</option>';
            subSelect.innerHTML = '<option value="" selected>-- เลือกผู้ปฏิบัติงานแทน --</option>';
            EMPLOYEE_OPTIONS.forEach(n => {
                const opt = `<option value="${n}">${n}</option>`;
                empSelect.innerHTML += opt; subSelect.innerHTML += opt;
            });

            document.getElementById('log-table-body').innerHTML = '';
            totalRows = 0;
            addTableRows(ROWS_TO_ADD_BATCH);
        } catch (e) { console.error("Load Error:", e); }
    }

    function addTableRows(numRows = ROWS_TO_ADD_BATCH) {
        const tableBody = document.getElementById('log-table-body');
        const startIndex = totalRows;
        
        let custOpt = '<option value="" disabled selected>-- ผู้แจ้งงาน --</option>';
        CUSTOMER_OPTIONS.forEach(i => custOpt += `<option value="${i.value}">${i.text}</option>`);
        let agOpt = '<option value="" disabled selected>-- Agent --</option>';
        AGENT_OPTIONS.forEach(i => agOpt += `<option value="${i.value}" ${i.isHeader?'disabled class="group-header-option"':''}>${i.text}</option>`);
        let topOpt = '<option value="" disabled selected>-- หัวข้อ --</option>';
        TOPIC_OPTIONS.forEach(i => topOpt += `<option value="${i.value}" ${i.isHeader?'disabled class="group-header-option"':''}>${i.text}</option>`);
        let statOpt = '<option value="">-- สถานะ --</option>';
        STATUS_OPTIONS_LOADED.forEach(o => statOpt += `<option value="${o.value}">${o.text}</option>`);
        let hrOpt = '<option value="" disabled selected>-- ชม. --</option>';
        TIME_OPTIONS.hours.forEach(o => hrOpt += `<option value="${o.value}">${o.text}</option>`);
        let minOpt = '<option value="" disabled selected>-- นาที --</option>';
        TIME_OPTIONS.minutes.forEach(o => minOpt += `<option value="${o.value}" ${o.value==0?'selected':''}>${o.text}</option>`);

        for (let i = startIndex; i < startIndex + numRows; i++) {
            const row = document.createElement('tr');
            row.id = `log-row-${i}`;
            row.innerHTML = `
                <td>${i + 1}</td>
                <td><select id="requester-${i}" name="requester-select">${custOpt}</select></td>
                <td><select id="agent-${i}" name="agent-select" class="placeholder-background">${agOpt}</select></td>
                <td><select id="topic-${i}" name="topic-select">${topOpt}</select></td>
                <td><input type="text" id="detail-${i}" placeholder="งาน..."></td>
                <td><input type="text" id="problem-${i}" placeholder="ปัญหา..."></td>
                <td><select id="duration-${i}" name="duration-select">${hrOpt}</select></td>
                <td><select id="minute-${i}" name="minute-select">${minOpt}</select></td>
                <td><select id="status-${i}" name="status-select">${statOpt}</select></td>
                <td><input type="text" id="note-${i}" placeholder="ที่ปรึกษา"></td>
                <td><button type="button" onclick="deleteRow(${i})" class="text-red-600 font-bold">ลบ</button></td>
            `;
            tableBody.appendChild(row);
        }
        totalRows += numRows;
        updateSelectColorOnLoad();
        updateTotalDurationDisplay();
    }

    function deleteRow(idx) {
        const row = document.getElementById(`log-row-${idx}`);
        if (row) { row.remove(); updateTotalDurationDisplay(); }
    }

    function updateSelectColorOnLoad() {
        document.querySelectorAll('#log-table-body select').forEach(s => {
            s.style.color = s.value === '' ? PLACEHOLDER_TEXT_COLOR : ACTIVE_TEXT_COLOR;
            s.addEventListener('change', function() {
                this.style.color = ACTIVE_TEXT_COLOR;
                if (this.name === 'agent-select') this.classList.toggle('placeholder-background', this.value === '');
            });
        });
    }

    function updateTotalDurationDisplay() {
        let totalMin = 0;
        document.querySelectorAll('select[name="duration-select"]').forEach(s => {
            if(s.value) totalMin += parseFloat(s.value) * 60;
        });
        document.querySelectorAll('select[name="minute-select"]').forEach(s => {
            if(s.value) totalMin += parseInt(s.value);
        });
        const h = Math.floor(totalMin / 60), m = totalMin % 60;
        document.getElementById('totalDurationDisplay').innerHTML = `รวมเวลา: <span class="text-primary-accent">${h} ชม. ${m} นาที</span>`;
    }

    document.getElementById('logForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'กำลังส่งข้อมูล...';

        const logEntries = [];
        const rows = document.querySelectorAll('#log-table-body tr');
        rows.forEach(row => {
            const idx = row.id.split('-')[2];
            const topic = document.getElementById(`topic-${idx}`);
            const det = document.getElementById(`detail-${idx}`);
            const stat = document.getElementById(`status-${idx}`);

            if (topic && topic.value && det && det.value && stat && stat.value) {
                logEntries.push({
                    requester: document.getElementById(`requester-${idx}`).value,
                    agent: document.getElementById(`agent-${idx}`).value,
                    topic: topic.value,
                    detail: det.value,
                    problem: document.getElementById(`problem-${idx}`).value,
                    duration: document.getElementById(`duration-${idx}`).value,
                    minuteDuration: document.getElementById(`minute-${idx}`).value,
                    status: stat.value,
                    note: document.getElementById(`note-${idx}`).value
                });
            }
        });

        const data = {
            dateDisplay: document.getElementById('date').value,
            agent: document.getElementById('requester').value,
            logEntries: logEntries,
            notes: document.getElementById('notes').value,
            createdAt: new Date().toISOString(),
            leaveStatus: {
                isLeave: document.getElementById('leave_checkbox').checked,
                leaveDetails: document.getElementById('leave_details').value,
                isTraining: document.getElementById('training_checkbox').checked,
                trainingDetails: document.getElementById('training_details').value,
                isFieldwork: document.getElementById('fieldwork_checkbox').checked,
                fieldworkDetails: document.getElementById('fieldwork_details').value,
                substituteWorker: document.getElementById('substitute_worker').value
            }
        };

        // สำรองข้อมูล
        finalExportData = JSON.parse(JSON.stringify(data)); 

        try {
            const response = await fetch(GAS_WEBHOOK_URL, {
                method: 'POST',
                body: JSON.stringify(data) 
            });

            const result = await response.json(); 

            if (result.status === 'success') {
                showMessage("บันทึกข้อมูลเรียบร้อยแล้ว", "success");
                
                document.getElementById('logForm').reset();
                const d = new Date();
                document.getElementById('date').value = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
                
                loadConfigurationData(); 
                showExportModal(); 
            } else {
                throw new Error(result.message || "เกิดข้อผิดพลาดไม่สามารถบันทึกได้");
            }

        } catch (err) {
            console.error("Submission Error:", err);
            showMessage("เกิดข้อผิดพลาด: " + err.message, "error");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'บันทึกการปฏิบัติงาน';
        }
    });

    // --- ส่วนที่แก้ไข: Export Excel แบบแปลงวันที่เป็นไทย ---
    document.getElementById('exportExcelBtn').addEventListener('click', function() {
        if (!finalExportData) {
            alert("ไม่พบข้อมูลสำหรับ Export");
            return;
        }

        const data = finalExportData;
        const exportTable = document.getElementById('combined-export-table');
        const tbody = exportTable.querySelector('tbody');
        tbody.innerHTML = ''; 

        // 1. คำนวณเวลา
        let totalMin = 0;
        data.logEntries.forEach(entry => {
            if(entry.duration) totalMin += parseFloat(entry.duration) * 60;
            if(entry.minuteDuration) totalMin += parseInt(entry.minuteDuration);
        });
        const h = Math.floor(totalMin / 60), m = totalMin % 60;
        const timeDisplay = `${h} ชั่วโมง ${m} นาที`;

        // 2. แปลงวันที่เป็นไทย (เช่น "3 มกราคม 2569")
        // ฟังก์ชันนี้จะแปลงจาก DD/MM/YYYY
        let thaiDateString = data.dateDisplay;
        if (thaiDateString.includes('/')) {
            const parts = thaiDateString.split('/');
            if (parts.length === 3) {
                const day = parseInt(parts[0], 10); // ตัดเลข 0 นำหน้าออก (เช่น 03 -> 3)
                const monthIndex = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                
                const thaiMonths = [
                    "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                    "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
                ];
                
                const thaiYear = year + 543; // แปลง ค.ศ. เป็น พ.ศ.
                
                // สร้างรูปแบบ "3 มกราคม 2569"
                if (thaiMonths[monthIndex]) {
                    thaiDateString = `${day} ${thaiMonths[monthIndex]} ${thaiYear}`;
                }
            }
        }

        // 3. สร้าง Header 
        // ใส่ thaiDateString ลงไปเลย ไม่ต้องใส่ &nbsp; หรือ ="..." แล้ว
        // เพราะข้อความที่มีภาษาไทย Excel จะมองเป็น Text ให้เองครับ
        let html = `
            <tr><th colspan="11" style="background-color: #e9e5f1; font-weight: bold;">ข้อมูลสรุปการปฏิบัติงาน</th></tr>
            <tr>
                <td style="font-weight: bold;">วันที่:</td>
                <td colspan="10" align="left" style="text-align: left;">${thaiDateString}</td>
            </tr>
            <tr>
                <td style="font-weight: bold;">พนักงาน:</td>
                <td colspan="10" align="left" style="text-align: left;">${data.agent}</td>
            </tr>
            <tr>
                <td style="font-weight: bold;">ลา:</td>
                <td colspan="10" align="left" style="text-align: left;">${data.leaveStatus.isLeave ? '✓ (' + data.leaveStatus.leaveDetails + ')' : '-'}</td>
            </tr>
            <tr>
                <td style="font-weight: bold;">อบรมประจำปี:</td>
                <td colspan="10" align="left" style="text-align: left;">${data.leaveStatus.isTraining ? '✓ (' + data.leaveStatus.trainingDetails + ')' : '-'}</td>
            </tr>
            <tr>
                <td style="font-weight: bold;">ลงพื้นที่:</td>
                <td colspan="10" align="left" style="text-align: left;">${data.leaveStatus.isFieldwork ? '✓ (' + data.leaveStatus.fieldworkDetails + ')' : '-'}</td>
            </tr>
            <tr>
                <td style="font-weight: bold;">ผู้ปฏิบัติงานแทน:</td>
                <td colspan="10" align="left" style="text-align: left;">${data.leaveStatus.substituteWorker || '-'}</td>
            </tr>
            <tr>
                <td style="font-weight: bold;">หมายเหตุ:</td>
                <td colspan="10" align="left" style="text-align: left;">${data.notes || '-'}</td>
            </tr>
             <tr>
                <td style="font-weight: bold;">รวมเวลา:</td>
                <td colspan="10" align="left" style="text-align: left;">${timeDisplay}</td>
            </tr>
            <tr><td colspan="11"></td></tr>
            <tr>
                <th>#</th><th>ผู้แจ้ง</th><th>Agent</th><th>หัวข้อ</th><th>รายละเอียด</th>
                <th>ปัญหา</th><th>ชม.</th><th>นาที</th><th>สถานะ</th><th>ที่ปรึกษา</th>
            </tr>
        `;

        data.logEntries.forEach((entry, idx) => {
            html += `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${entry.requester}</td>
                    <td>${entry.agent}</td>
                    <td>${entry.topic}</td>
                    <td>${entry.detail}</td>
                    <td>${entry.problem}</td>
                    <td>${entry.duration}</td>
                    <td>${entry.minuteDuration}</td>
                    <td>${entry.status}</td>
                    <td>${entry.note}</td>
                </tr>
            `;
        });

        tbody.innerHTML = html;

        // เปลี่ยนชื่อไฟล์
        const safeDate = data.dateDisplay.replace(/\//g, '-');
        const fileName = `Report_${data.agent}_${safeDate}`;
        const table2excel = new Table2Excel();
        table2excel.export(exportTable, fileName);

        hideExportModal();
    });

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('log-table-body').addEventListener('change', function(e) {
            if (e.target && (e.target.name === 'duration-select' || e.target.name === 'minute-select')) {
                updateTotalDurationDisplay();
            }
        });
    });

    function showExportModal() {
        const m = document.getElementById('exportModal');
        m.classList.remove('hidden');
        setTimeout(() => {
            document.getElementById('exportModalBackdrop').classList.add('opacity-100');
            document.getElementById('exportModalContent').classList.add('scale-100', 'opacity-100');
        }, 50);
    }

    function hideExportModal() {
        document.getElementById('exportModal').classList.add('hidden');
    }

    document.getElementById('closeModalBtn').onclick = hideExportModal;
    document.getElementById('closeFinalModalBtn').onclick = () => document.getElementById('finalStatusModal').classList.add('hidden');
    document.getElementById('addRowBtn').onclick = () => addTableRows(ROWS_TO_ADD_BATCH);
    
    window.onload = () => {
        const d = new Date();
        document.getElementById('date').value = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        loadConfigurationData();
    };
</script>
